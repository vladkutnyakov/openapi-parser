<!doctype html>
<html><head><meta charset="utf-8"><style>
  /* Ровно 256x256 без полей — скриншот окна такого же размера даёт чистый PNG */
  html,body { margin:0; padding:0; width:256px; height:256px; overflow:hidden; }
  /*
    Подложка тёмная, как редактор: иконка расширения показывается на своём фоне
    в списке Extensions, и прозрачный PNG там выглядел бы бледно.
    Слегка скруглённый квадрат — как у большинства иконок в маркетплейсе.
  */
  .bg {
    width:256px; height:256px;
    background:#1f2430;
    display:flex; align-items:center; justify-content:center;
  }
  svg { display:block; }
</style></head><body>
<div class="bg">
  <!-- та же геометрия, что в assets/icon.svg, но с запасом по толщине для крупного размера -->
  <svg width="176" height="176" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
    <g fill="none" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#FFD700">
        <path d="M5.4 2.6C4.2 2.6 3.7 3.2 3.7 4.3v2C3.7 7.4 3.3 8 2.4 8c.9 0 1.3.6 1.3 1.7v2c0 1.1.5 1.7 1.7 1.7"/>
        <path d="M10.6 2.6c1.2 0 1.7.6 1.7 1.7v2c0 1.1.4 1.7 1.3 1.7-.9 0-1.3.6-1.3 1.7v2c0 1.1-.5 1.7-1.7 1.7"/>
      </g>
      <path stroke="#4FC1FF" d="M6.2 8h3.6M8.1 6.5 9.6 8 8.1 9.5"/>
    </g>
  </svg>
</div>
</body></html>
